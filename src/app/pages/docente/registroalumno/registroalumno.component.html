<div class="d-flex flex-row bd-highlight mb-3">
  <app-sidebar varaalumno="texto"></app-sidebar>
  <div class="container-fluid cold-md-4 quitarmargen">
    <h1 style="text-align: center; margin-top: 10px">Registrar Nuevo Alumno</h1>
    <hr>
    <div class="container">
      <div class="card">
        <div class="card-header bg-secondary text-white">Datos del alumno</div>
        <div class="card-body">
          <form (ngSubmit)="registrar()">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="alumno.Nombre" name="Nombre" required>
            </div>
            <div class="form-group">
              <label>Apellido</label>
              <input type="text" class="form-control" [(ngModel)]="alumno.Apellido" name="Apellido" required>
            </div>
            <div class="form-group">
              <label>DNI</label>
              <input type="number" class="form-control" [(ngModel)]="alumno.dni" name="dni" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" [(ngModel)]="alumno.email" name="email">
            </div>
            <div class="form-group">
              <label>Foto del rostro</label>
              <input type="file" class="form-control-file" (change)="selectImage($event)" accept="image/*">
              <div *ngIf="preview">
                <img [src]="preview" width="120" height="120"
                  style="object-fit: cover; border-radius: 8px; margin-top: 10px;">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Registrar Alumno</button>
          </form>
        </div>
      </div>
      <p class="text-muted mt-3">
        Después de registrarlo, ve a <b>Registro Alumno</b> para vincularlo a un curso por su DNI.
      </p>
    </div>
  </div>
</div>
